name: Publish Jester Image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to package and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-jester-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/benlagrone/my-strudel-flutes:sha-${{ inputs.source_sha }}

      - name: Publish Summary
        run: |
          {
            echo "## Jester Image Publish"
            echo ""
            echo "- Source SHA: \`${{ inputs.source_sha }}\`"
            echo "- Image: \`ghcr.io/benlagrone/my-strudel-flutes:sha-${{ inputs.source_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
